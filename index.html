<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Stacker</title>
<style>
  :root {
    --font: 'Avenir Next', 'Helvetica Neue', 'Segoe UI', system-ui, sans-serif;
    --panel: rgba(16, 20, 38, 0.42);
    --panel-brd: rgba(255,255,255,0.16);
    --ink: #ffffff;
    --ink-dim: rgba(255,255,255,0.68);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    font-family: var(--font);
    background: #16213e;
    -webkit-user-select: none; user-select: none;
    touch-action: none; cursor: pointer;
  }
  #scene { position: fixed; inset: 0; z-index: 1; transition: background 0.6s ease; }
  canvas { display: block; }

  /* ---------- In-game HUD ---------- */
  #hud {
    position: fixed; inset: 0; z-index: 10; pointer-events: none;
    opacity: 0; visibility: hidden;
    transition: opacity .4s ease, visibility 0s linear .4s;
  }
  #hud.on { opacity: 1; visibility: visible; transition: opacity .4s ease, visibility 0s; }

  #topbar {
    position: absolute; top: max(16px, 3vh); left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 0 clamp(16px, 5vw, 40px);
  }
  .chip {
    background: var(--panel); border: 1px solid var(--panel-brd);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-radius: 14px; padding: 9px 15px; color: var(--ink);
    font-weight: 700; letter-spacing: .5px;
    display: flex; flex-direction: column; align-items: center; min-width: 68px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.18);
  }
  .chip .k { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; opacity: .62; margin-bottom: 2px; font-weight: 700; }
  .chip .v { font-size: clamp(18px, 5vw, 24px); font-variant-numeric: tabular-nums; }
  .chip .v small { font-size: .55em; opacity: .6; font-weight: 700; }

  #score {
    position: absolute; top: 15vh; left: 0; right: 0;
    text-align: center; color: #fff;
    font-size: clamp(64px, 15vw, 140px);
    font-weight: 800; letter-spacing: -3px;
    text-shadow: 0 8px 30px rgba(0,0,0,0.32);
    font-variant-numeric: tabular-nums; will-change: transform;
  }
  #combo {
    position: absolute; top: calc(15vh + clamp(70px, 16vw, 150px)); left: 0; right: 0;
    text-align: center; color: #fff; font-weight: 800;
    font-size: clamp(16px, 4.4vw, 24px); letter-spacing: 3px;
    text-transform: uppercase; opacity: 0;
    text-shadow: 0 2px 12px rgba(0,0,0,0.3);
    transition: opacity .18s ease;
  }

  /* ---------- Overlays ---------- */
  .overlay {
    position: fixed; inset: 0; z-index: 20;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; color: var(--ink); padding: 28px 22px 70px;
    opacity: 0; visibility: hidden; pointer-events: none;
    transition: opacity .45s ease, visibility 0s linear .45s;
    overflow-y: auto;
  }
  .overlay.on { opacity: 1; visibility: visible; pointer-events: auto; transition: opacity .45s ease, visibility 0s; }

  .scrim {
    position: absolute; inset: 0; z-index: -1;
    background: radial-gradient(120% 90% at 50% 0%, rgba(0,0,0,0.12), rgba(0,0,0,0.42));
  }

  /* Title */
  .title {
    font-size: clamp(62px, 18vw, 150px); font-weight: 800;
    letter-spacing: -5px; line-height: .85;
    text-shadow: 0 12px 46px rgba(0,0,0,0.34);
    animation: drop-in .7s cubic-bezier(.2,.9,.3,1) both;
  }
  .subtitle {
    margin-top: 16px; font-size: clamp(12px, 3.4vw, 15px);
    letter-spacing: 7px; text-transform: uppercase; font-weight: 700;
    color: var(--ink-dim);
    animation: drop-in .7s .08s cubic-bezier(.2,.9,.3,1) both;
  }
  @keyframes drop-in { from { opacity: 0; transform: translateY(-26px); } to { opacity: 1; transform: translateY(0); } }

  .best-pill {
    display: inline-flex; align-items: center; gap: 9px;
    background: var(--panel); border: 1px solid var(--panel-brd);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-radius: 100px; padding: 10px 22px; font-weight: 700; letter-spacing: 1px;
    font-size: clamp(13px, 3.6vw, 15px);
  }
  .pill-row {
    margin-top: 26px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;
    animation: drop-in .7s .16s cubic-bezier(.2,.9,.3,1) both;
  }
  .coin-pill { border-color: rgba(255,210,120,0.5); transition: transform .12s ease; }
  .coin-pill.bump { transform: scale(1.12); }
  .coin-pill.shake { animation: shake .4s; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 20%,60%{transform:translateX(-6px)} 40%,80%{transform:translateX(6px)} }
  .best-pill .star { font-size: 1.1em; }
  .best-pill b { font-variant-numeric: tabular-nums; }

  /* Settings */
  .settings {
    margin-top: 30px; width: min(440px, 92vw);
    display: flex; flex-direction: column; gap: 16px;
    position: relative; z-index: 2;
    animation: drop-in .7s .22s cubic-bezier(.2,.9,.3,1) both;
  }
  .set-row { text-align: left; }
  .set-label {
    font-size: 11px; letter-spacing: 2.5px; text-transform: uppercase;
    font-weight: 800; color: var(--ink-dim); margin: 0 0 8px 4px;
  }
  .seg {
    display: flex; gap: 6px; background: var(--panel); border: 1px solid var(--panel-brd);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-radius: 14px; padding: 5px;
  }
  .seg button {
    flex: 1; border: none; background: transparent; color: var(--ink-dim);
    font-family: var(--font); font-weight: 700; letter-spacing: .5px;
    font-size: clamp(12px, 3.4vw, 14px); padding: 12px 8px; border-radius: 10px;
    cursor: pointer; transition: all .16s ease; white-space: nowrap;
  }
  .seg button:hover { color: #fff; }
  .seg button small { display: block; font-size: .72em; opacity: .62; margin-top: 3px; font-weight: 700; letter-spacing: 0; }
  .seg button.active {
    background: #fff; color: #1a1a2e;
    box-shadow: 0 4px 14px rgba(0,0,0,0.22);
  }
  .seg.themes button.active { color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,.4); }
  /* Themes get a roomier 3-column grid so each is an easy tap target */
  .seg.themes {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 6px;
  }
  .seg.themes button { padding: 14px 8px; min-width: 0; position: relative; }
  .seg.themes button.locked { opacity: .5; }
  .seg.themes button.locked .swatch { filter: grayscale(.6); }
  .seg.themes button .lock { position: absolute; top: 3px; right: 5px; font-size: 10px; opacity: .9; }
  .theme-help {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    margin: 9px 4px 0; font-size: clamp(11px, 3vw, 13px); color: var(--ink-dim); font-weight: 600;
  }
  .theme-help b { color: #ffd98a; }
  .mini-btn {
    flex-shrink: 0; border: 1px solid var(--panel-brd); background: var(--panel);
    color: #fff; font-family: var(--font); font-weight: 700; letter-spacing: .5px;
    font-size: clamp(11px, 3vw, 13px); padding: 8px 13px; border-radius: 100px; cursor: pointer;
    transition: all .14s ease; white-space: nowrap;
  }
  .mini-btn:hover { background: rgba(255,255,255,0.16); }
  .mini-btn:disabled { opacity: .5; cursor: default; }
  .swatch { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.4); }

  /* Buttons */
  .btn {
    pointer-events: auto;
    background: #fff; color: #1a1a2e; border: none;
    font-family: var(--font); font-weight: 800; letter-spacing: 1.5px;
    font-size: clamp(17px, 4.8vw, 21px); text-transform: uppercase;
    padding: 19px 54px; border-radius: 100px; cursor: pointer;
    box-shadow: 0 14px 38px rgba(0,0,0,0.3);
    transition: transform .14s ease, box-shadow .14s ease;
  }
  .btn:hover { transform: translateY(-3px) scale(1.03); box-shadow: 0 20px 48px rgba(0,0,0,0.36); }
  .btn:active { transform: translateY(0) scale(.98); }
  .btn.ghost {
    background: transparent; color: #fff; border: 1.5px solid rgba(255,255,255,0.5);
    box-shadow: none; padding: 17px 40px; font-size: clamp(14px,4vw,17px);
  }
  .btn.ghost:hover { background: rgba(255,255,255,0.12); border-color: #fff; }

  #playBtn { margin-top: 32px; animation: drop-in .7s .3s cubic-bezier(.2,.9,.3,1) both; }
  .hint {
    margin-top: 20px; font-size: clamp(12px, 3.4vw, 14px);
    font-weight: 600; letter-spacing: 1.5px; color: var(--ink-dim);
    animation: pulse 1.9s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{opacity:.4;} 50%{opacity:.95;} }

  /* Game over */
  .go-badge {
    display: inline-block; background: linear-gradient(135deg, #ffd34e, #ff8a3d);
    color: #3a1d00; font-weight: 800; letter-spacing: 2px; text-transform: uppercase;
    font-size: clamp(13px, 3.6vw, 16px); padding: 9px 22px; border-radius: 100px;
    margin-bottom: 14px; box-shadow: 0 10px 30px rgba(255,160,60,0.4);
    animation: badge-pop .5s cubic-bezier(.2,1.4,.4,1) both;
  }
  @keyframes badge-pop { from { opacity:0; transform: scale(.5) rotate(-8deg);} to {opacity:1; transform: scale(1) rotate(-2deg);} }
  .go-label { font-size: clamp(14px,4vw,18px); font-weight:800; letter-spacing:5px; text-transform:uppercase; color: var(--ink-dim); }
  .go-score { font-size: clamp(88px, 24vw, 200px); font-weight: 800; letter-spacing: -5px; line-height: 1; margin: 2px 0 20px; font-variant-numeric: tabular-nums; text-shadow: 0 10px 40px rgba(0,0,0,.34); }

  .stats {
    display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px;
    width: min(400px, 90vw); margin-bottom: 34px;
  }
  .stat {
    background: var(--panel); border: 1px solid var(--panel-brd);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-radius: 16px; padding: 16px 10px;
  }
  .stat .sv { font-size: clamp(26px, 7vw, 36px); font-weight: 800; font-variant-numeric: tabular-nums; }
  .stat .sk { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; opacity: .6; font-weight: 800; margin-top: 3px; }
  .go-actions { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }

  .go-coins { font-size: clamp(13px, 3.6vw, 16px); font-weight: 700; color: #ffd98a; margin-bottom: 26px; letter-spacing: .5px; }
  .go-coins span { font-variant-numeric: tabular-nums; }

  #toast {
    position: fixed; left: 50%; bottom: 16%; transform: translateX(-50%) translateY(10px);
    z-index: 40; background: rgba(16,20,38,0.9); border: 1px solid var(--panel-brd);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    color: #fff; font-weight: 700; letter-spacing: .5px; font-size: clamp(13px, 3.6vw, 15px);
    padding: 13px 24px; border-radius: 100px; box-shadow: 0 12px 34px rgba(0,0,0,0.3);
    opacity: 0; pointer-events: none; transition: opacity .2s ease, transform .2s ease;
  }
  #toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }

  #flash { position: fixed; inset: 0; z-index: 15; background: #fff; opacity: 0; pointer-events: none; transition: opacity .09s ease; }
</style>
<!-- CrazyGames SDK (loads only on CrazyGames; blocked/ignored elsewhere, game falls back to localStorage) -->
<script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>

<body>
  <div id="scene"></div>
  <div id="flash"></div>
  <div id="toast"></div>

  <!-- In-game HUD -->
  <div id="hud">
    <div id="topbar">
      <div class="chip"><span class="k">Level</span><span class="v" id="diffChip">Normal</span></div>
      <div class="chip"><span class="k" id="coinMultLabel">Coins</span><span class="v" id="coinChip">0</span></div>
      <div class="chip"><span class="k">Perfect</span><span class="v" id="perfChip">0</span></div>
    </div>
    <div id="score">0</div>
    <div id="combo"></div>
  </div>

  <!-- Start / menu -->
  <div class="overlay on" id="startScreen">
    <div class="scrim"></div>
    <div class="title">STACKER</div>
    <div class="subtitle">stack &middot; align &middot; survive</div>

    <div class="pill-row">
      <div class="best-pill"><span class="star">★</span> BEST&nbsp; <b id="menuBest">0</b></div>
      <div class="best-pill coin-pill" id="coinPill">🪙&nbsp; <b id="menuCoins">0</b></div>
    </div>

    <div class="settings">
      <div class="set-row">
        <div class="set-label">Difficulty</div>
        <div class="seg" id="segDiff">
          <button data-v="easy">Easy<small>×1 🪙</small></button>
          <button data-v="normal">Normal<small>×2 🪙</small></button>
          <button data-v="hard">Hard<small>×3 🪙</small></button>
          <button data-v="insane">Insane<small>×5 🪙</small></button>
        </div>
      </div>
      <div class="set-row">
        <div class="set-label">Theme</div>
        <div class="seg themes" id="segTheme">
          <button data-v="aurora"><span class="swatch" style="background:conic-gradient(from 90deg,#ff5f6d,#ffc371,#4caf5a,#2f8fe0,#c86dd7,#ff5f6d)"></span>Aurora</button>
          <button data-v="sunset"><span class="swatch" style="background:#ff8a2f"></span>Sunset</button>
          <button data-v="ocean"><span class="swatch" style="background:#2f8fe0"></span>Ocean</button>
          <button data-v="candy"><span class="swatch" style="background:#ff5fbf"></span>Candy</button>
          <button data-v="mono"><span class="swatch" style="background:#b7c0d8"></span>Mono</button>
          <button data-v="forest"><span class="swatch" style="background:#3ea64f"></span>Forest</button>
        </div>
        <div class="theme-help">
          <span>Locked themes cost <b>1000&nbsp;🪙</b> each</span>
          <button class="mini-btn" id="unlockRandomBtn">▶ Ad: unlock random</button>
        </div>
      </div>
      <div class="set-row">
        <div class="set-label">Sound</div>
        <div class="seg" id="segSound">
          <button data-v="on">On</button>
          <button data-v="off">Off</button>
        </div>
      </div>
    </div>

    <button class="btn" id="playBtn">Play</button>
    <div class="hint">Space or click to drop a block</div>
  </div>

  <!-- Game over -->
  <div class="overlay" id="gameOverScreen">
    <div class="scrim"></div>
    <div class="go-badge" id="newBest" style="display:none">New Best!</div>
    <div class="go-label">Game Over</div>
    <div class="go-score" id="finalScore">0</div>
    <div class="stats">
      <div class="stat"><div class="sv" id="stBlocks">0</div><div class="sk">Blocks</div></div>
      <div class="stat"><div class="sv" id="stPerf">0</div><div class="sk">Perfects</div></div>
      <div class="stat"><div class="sv" id="stStreak">0</div><div class="sk">Best Streak</div></div>
      <div class="stat"><div class="sv" id="stBest">0</div><div class="sk">All-time Best</div></div>
    </div>
    <div class="go-coins">🪙 +<span id="goCoinsRun">0</span> earned&nbsp; ·&nbsp; <span id="goCoinsTotal">0</span> total</div>
    <button class="mini-btn" id="doubleBtn" style="margin-bottom:24px">▶ Double Coins (Ad)</button>
    <div class="go-actions">
      <button class="btn" id="againBtn">Play Again</button>
      <button class="btn ghost" id="menuBtn">Menu</button>
    </div>
  </div>

  <!-- Continue (rewarded ad) -->
  <div class="overlay" id="continueScreen">
    <div class="scrim"></div>
    <div class="go-label">You Missed</div>
    <div class="go-score" id="continueScore">0</div>
    <div class="go-actions">
      <button class="btn" id="continueBtn">&#9654;&nbsp; Watch Ad &amp; Continue</button>
      <button class="btn ghost" id="continueCoinBtn">Continue (250 🪙)</button>
      <button class="btn ghost" id="giveupBtn">Give Up</button>
    </div>
    <div class="hint" style="margin-top:22px">One continue per run</div>
  </div>

<script type="module">
import * as THREE from 'https://artifactcdn.diabrowser.engineering/ajax/libs/three.js/three.module.js';

// ---------------------------------------------------------------------------
// Constants & tunables
// ---------------------------------------------------------------------------
const BOX_HEIGHT = 1;
const INIT_SIZE  = 4;
const MOVE_RANGE  = 6.5;
const VIEW_SIZE   = 15;

const DIFFICULTIES = {
  easy:   { label: 'Easy',   base: 0.055, ramp: 0.0022, cap: 0.14, tol: 0.34 },
  normal: { label: 'Normal', base: 0.07,  ramp: 0.0035, cap: 0.19, tol: 0.23 },
  hard:   { label: 'Hard',   base: 0.095, ramp: 0.0050, cap: 0.27, tol: 0.15 },
  insane: { label: 'Insane', base: 0.13,  ramp: 0.0070, cap: 0.38, tol: 0.10 },
};

// theme → color generation. randomStart gives full-rainbow variety; others stay in-family.
const THEMES = {
  aurora: { randomStart: true, step: 9,  range: 360, sat: 0.60, light: 0.62 }, // full rainbow
  sunset: { start: 18,  step: 6, range: 34,  sat: 0.74, light: 0.58 }, // orange → amber → gold
  ocean:  { start: 195, step: 5, range: 48,  sat: 0.60, light: 0.54 }, // cyan → blue
  candy:  { start: 308, step: 7, range: 52,  sat: 0.70, light: 0.70 }, // magenta → pink
  mono:   { start: 218, step: 3, range: 26,  sat: 0.12, light: 0.66 }, // near-greyscale
  forest: { start: 100, step: 5, range: 52,  sat: 0.52, light: 0.48 }, // leaf → deep green
};

const THEME_COST = 1000;                                      // coins to unlock a theme
const CONTINUE_COST = 250;                                    // coins to revive after a miss
const COIN_RATE  = { easy: 1, normal: 2, hard: 3, insane: 5 }; // coins earned per point
const THEME_KEYS = ['aurora', 'sunset', 'ocean', 'candy', 'mono', 'forest'];

// ---------------------------------------------------------------------------
// Persistent storage — CrazyGames data module when available, else localStorage.
// The CrazyGames data module syncs across devices for logged-in players and
// survives the third-party-iframe storage limits that plain localStorage hits.
// ---------------------------------------------------------------------------
const Store = {
  sdk: null,
  async init() {
    try {
      if (window.CrazyGames && window.CrazyGames.SDK) {
        // On non-CrazyGames hosts (GitHub Pages, local) init() can hang forever
        // waiting for the parent frame — race it against a timeout so the game
        // always finishes booting and falls back to localStorage.
        await Promise.race([
          window.CrazyGames.SDK.init(),
          new Promise((_, reject) => setTimeout(() => reject(new Error('sdk init timeout')), 3000)),
        ]);
        this.sdk = window.CrazyGames.SDK;
        try { this.sdk.game.loadingStop(); } catch (e) {}
      }
    } catch (e) { this.sdk = null; }
  },
  get(key) {
    try { if (this.sdk && this.sdk.data) return this.sdk.data.getItem(key); } catch (e) {}
    try { return localStorage.getItem(key); } catch (e) { return null; }
  },
  set(key, val) {
    const v = String(val);
    try { if (this.sdk && this.sdk.data) { this.sdk.data.setItem(key, v); return; } } catch (e) {}
    try { localStorage.setItem(key, v); } catch (e) {}
  },
  // CrazyGames gameplay signals (safe no-ops when the SDK isn't present)
  gameplayStart() { try { this.sdk && this.sdk.game.gameplayStart(); } catch (e) {} },
  gameplayStop()  { try { this.sdk && this.sdk.game.gameplayStop(); } catch (e) {} },
  happytime()     { try { this.sdk && this.sdk.game.happytime(); } catch (e) {} },
  hasAds()        { return !!(this.sdk && this.sdk.ad); },
  // Rewarded ad → onReward on success, onFail on error/unfilled/adblock.
  requestRewarded(onReward, onFail) {
    if (this.sdk && this.sdk.ad) {
      // In non-production environments (local / QA preview) ads don't fill, so
      // treat a failed ad as success there — lets you test the reward flow.
      // On the real published site (environment === 'crazygames') a failed ad
      // correctly grants nothing.
      const devEnv = this.sdk.environment && this.sdk.environment !== 'crazygames';
      this.sdk.ad.requestAd('rewarded', {
        adStarted:  () => { adMuted = true; },
        adError:    () => { adMuted = false; devEnv ? onReward() : onFail(); },
        adFinished: () => { adMuted = false; onReward(); },
      });
    } else {
      onReward(); // no ad platform (plain preview / local / GitHub) → grant for testing
    }
  },
};
// Boot the game immediately in local mode; let the CrazyGames SDK initialize in
// the BACKGROUND so the UI never waits on it. If it connects (on CrazyGames),
// reconcile the authoritative saved values once it's ready.
Store.init().then(() => { if (Store.sdk && state === 'start') reconcileFromStore(); });

// One-time wipe of progress: coins, best score, and unlocked themes.
if (!Store.get('stacker_reset_v3')) {
  Store.set('stacker_coins', '0');
  Store.set('stacker_best', '0');
  Store.set('stacker_unlocked', '');
  Store.set('stacker_reset_v3', '1');
}

// ---------------------------------------------------------------------------
// Leaderboard — paste your base64 key from the CrazyGames Developer Portal.
// Leave blank to disable submission. Scores are encrypted before sending.
// ---------------------------------------------------------------------------
const LEADERBOARD_KEY = '';
async function encryptScore(scoreVal, encryptionKey) {
  const iv = window.crypto.getRandomValues(new Uint8Array(12));
  const algorithm = { name: 'AES-GCM', iv };
  const keyBytes = new Uint8Array(atob(encryptionKey).split('').map(c => c.charCodeAt(0)));
  const cryptoKey = await window.crypto.subtle.importKey('raw', keyBytes, algorithm, false, ['encrypt']);
  const dataBuffer = new TextEncoder().encode(scoreVal.toString());
  const encryptedBuffer = await window.crypto.subtle.encrypt(algorithm, cryptoKey, dataBuffer);
  const combined = new Uint8Array(iv.length + encryptedBuffer.byteLength);
  combined.set(iv); combined.set(new Uint8Array(encryptedBuffer), iv.length);
  return btoa(String.fromCharCode(...combined));
}
async function submitLeaderboard(finalScore) {
  try {
    if (Store.sdk && Store.sdk.user && LEADERBOARD_KEY) {
      const enc = await encryptScore(finalScore, LEADERBOARD_KEY);

// ---------------------------------------------------------------------------
// Audio
// ---------------------------------------------------------------------------
let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audioCtx = null; } }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
function tone(freq, dur = 0.14, type = 'sine', vol = 0.18) {
  if (!audioCtx || !settings.sound || adMuted) return;
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
  osc.type = type; osc.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  osc.connect(g); g.connect(audioCtx.destination);
  osc.start(t); osc.stop(t + dur + 0.02);
}
const SCALE = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24, 26, 28];
function placeSound(lvl) { tone(220 * Math.pow(2, SCALE[Math.min(lvl, SCALE.length-1)]/12), 0.16, 'triangle', 0.16); }
function perfectSound(lvl) {
  const f = 330 * Math.pow(2, SCALE[Math.min(lvl, SCALE.length-1)]/12);
  tone(f, 0.18, 'sine', 0.2); tone(f * 1.5, 0.22, 'sine', 0.1);
}
function overSound() { tone(180, 0.3, 'sawtooth', 0.14); setTimeout(() => tone(120, 0.42, 'sawtooth', 0.12), 90); }
function clickSound() { tone(520, 0.07, 'square', 0.07); }

// ---------------------------------------------------------------------------
// Color / background from theme
// ---------------------------------------------------------------------------
function hueFor(index) {
  const t = THEMES[settings.theme];
  if (t.randomStart) return (baseHue + index * t.step) % 360;
  return (t.start + (index * t.step) % t.range + 360) % 360;
}
function colorFor(index) {
  const t = THEMES[settings.theme];
  const c = new THREE.Color();
  c.setHSL(hueFor(index) / 360, t.sat, t.light);
  return c;
}
function setBackground(index) {
  const t = THEMES[settings.theme];
  const h = hueFor(index);
  const s = Math.round(Math.max(14, t.sat * 72));
  // keep the backdrop in the SAME hue family as the blocks (small shift for depth)
  const top = `hsl(${(h + 14) % 360}, ${s}%, 24%)`;
  const bot = `hsl(${(h - 8 + 360) % 360}, ${Math.round(Math.max(16, t.sat * 80))}%, 46%)`;
  sceneEl.style.background = `linear-gradient(170deg, ${top} 0%, ${bot} 100%)`;
}

function makeBlock(sx, sz, px, py, pz, index) {
  const geo = new THREE.BoxGeometry(sx, BOX_HEIGHT, sz);
  const mat = new THREE.MeshLambertMaterial({ color: colorFor(index) });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(px, py, pz); mesh.castShadow = true; mesh.receiveShadow = true;
  scene.add(mesh);
  return { mesh, sizeX: sx, sizeZ: sz, posX: px, posZ: pz, posY: py };
}
function clearWorld() {
  [...stack, ...debris].forEach(b => { scene.remove(b.mesh); b.mesh.geometry.dispose(); b.mesh.material.dispose(); });
  if (moving) { scene.remove(moving.mesh); moving.mesh.geometry.dispose(); moving.mesh.material.dispose(); }
  if (pedestal) { scene.remove(pedestal); pedestal.geometry.dispose(); pedestal.material.dispose(); pedestal = null; }
  stack = []; debris = []; moving = null;
}

// Tall grey column the first block starts on top of (purely decorative).
function makePedestal() {
  const H = 40;
  const geo = new THREE.BoxGeometry(INIT_SIZE, H, INIT_SIZE);
  const mat = new THREE.MeshLambertMaterial({ color: 0x9aa2b1 });
  const mesh = new THREE.Mesh(geo, mat);
  // first block spans y[-0.5, 0.5]; sit the column directly beneath it
  mesh.position.set(0, -0.5 - H / 2, 0);
  mesh.castShadow = true; mesh.receiveShadow = true;
  scene.add(mesh);
  pedestal = mesh;
}

// ---------------------------------------------------------------------------
// Game flow
// ---------------------------------------------------------------------------
function startGame() {
  ensureAudio();
  clearWorld();
  score = 0; combo = 0; blocksPlaced = 0; runPerfects = 0; runBestStreak = 0;
  continueUsed = false; runCoins = 0;
  baseHue = Math.floor(Math.random() * 360);
  state = 'playing';

  startEl.classList.remove('on');
  overEl.classList.remove('on');
  hudEl.classList.add('on');
  scoreEl.textContent = '0';
  comboEl.style.opacity = '0';
  diffChip.textContent = DIFFICULTIES[settings.difficulty].label;
  perfChip.textContent = '0';
  const rate = COIN_RATE[settings.difficulty] || 1;
  $('coinMultLabel').textContent = 'Coins ×' + rate;
  updateCoinsUI();
  setBackground(0);
  showToast(`×${rate} coins per point`);

  stack.push(makeBlock(INIT_SIZE, INIT_SIZE, 0, 0, 0, 0));
  makePedestal();
  camTargetY = 0; camCurY = 0;
  Store.gameplayStart();
  spawnMoving();
}

function spawnMoving() {
  const top = stack[stack.length - 1];
  const index = stack.length;
  const axis = (index % 2 === 1) ? 'x' : 'z';
  const posY = index * BOX_HEIGHT;
  let px = top.posX, pz = top.posZ;
  if (axis === 'x') px = -MOVE_RANGE; else pz = -MOVE_RANGE;
  const blk = makeBlock(top.sizeX, top.sizeZ, px, posY, pz, index);
  blk.axis = axis;
  moving = blk; moveDir = 1;
  camTargetY = index * BOX_HEIGHT;
}

function drop() {
  if (state !== 'playing' || !moving) return;
  const top = stack[stack.length - 1];
  const axis = moving.axis;
  const TOL = DIFFICULTIES[settings.difficulty].tol;

  const movPos = axis === 'x' ? moving.posX : moving.posZ;
  const topPos = axis === 'x' ? top.posX : top.posZ;
  const movSize = axis === 'x' ? moving.sizeX : moving.sizeZ;
  const topSize = axis === 'x' ? top.sizeX : top.sizeZ;
  const delta = movPos - topPos;

  if (Math.abs(delta) >= topSize) { // total miss
    moving.axis = null;
    moving.vy = -0.02; moving.vx = Math.sign(delta || 1) * 0.08;
    moving.rot = (Math.random() - 0.5) * 0.1;
    debris.push(moving); moving = null;
    offerContinue(); return;
  }

  const coinBase = score;
  const perfect = Math.abs(delta) < TOL;

  if (perfect) {
    if (axis === 'x') moving.posX = top.posX; else moving.posZ = top.posZ;
    moving.mesh.position.x = moving.posX; moving.mesh.position.z = moving.posZ;
    combo++; runPerfects++;
    runBestStreak = Math.max(runBestStreak, combo);
    perfectSound(stack.length);
    flash(); showCombo();
    perfChip.textContent = runPerfects;
    score += 1 + combo; // streak bonus
  } else {
    combo = 0; comboEl.style.opacity = '0';
    placeSound(stack.length);
    const topLo = topPos - topSize/2, topHi = topPos + topSize/2;
    const movLo = movPos - movSize/2, movHi = movPos + movSize/2;
    const lo = Math.max(topLo, movLo), hi = Math.min(topHi, movHi);
    const overlap = hi - lo, center = (lo + hi) / 2;

    rebuildBlock(moving,
      axis === 'x' ? overlap : moving.sizeX,
      axis === 'z' ? overlap : moving.sizeZ,
      axis === 'x' ? center  : moving.posX,
      axis === 'z' ? center  : moving.posZ);

    const overhang = movSize - overlap;
    if (overhang > 0.02) {
      const side = movPos > topPos ? 1 : -1;
      const ohC = side > 0 ? hi + overhang/2 : lo - overhang/2;
      const d = makeBlock(
        axis === 'x' ? overhang : moving.sizeX,
        axis === 'z' ? overhang : moving.sizeZ,
        axis === 'x' ? ohC : moving.posX, moving.posY,
        axis === 'z' ? ohC : moving.posZ, stack.length);
      d.axis = null; d.vy = 0; d.rot = (Math.random() - 0.5) * 0.08;
      d.vx = axis === 'x' ? side * 0.06 : 0;
      d.vz = axis === 'z' ? side * 0.06 : 0;
      debris.push(d);
    }
    score += 1;
  }

  moving.axis = null;
  stack.push(moving); moving = null;
  blocksPlaced++;
  // coins earned = points gained this placement × difficulty rate
  const earned = (score - coinBase) * (COIN_RATE[settings.difficulty] || 1);
  if (earned > 0) { coins += earned; runCoins += earned; updateCoinsUI(); bumpCoins(); }
  scoreEl.textContent = score;
  scorePop = 1;
  setBackground(stack.length);
  spawnMoving();
}

function rebuildBlock(blk, sx, sz, px, pz) {
  blk.mesh.geometry.dispose();
  blk.mesh.geometry = new THREE.BoxGeometry(sx, BOX_HEIGHT, sz);
  blk.sizeX = sx; blk.sizeZ = sz; blk.posX = px; blk.posZ = pz;
  blk.mesh.position.x = px; blk.mesh.position.z = pz;
}

function gameOver() {
  state = 'over';
  Store.gameplayStop();
  overSound();
  submitLeaderboard(score);
  const isBest = score > best;
  if (isBest) { best = score; Store.set('stacker_best', best); }
  if (isBest && score > 0) Store.happytime();
  $('finalScore').textContent = score;
  $('stBlocks').textContent = blocksPlaced;

  $('menuBest').textContent = best;
  saveCoins();

  $('goCoinsTotal').textContent = coins;
  updateCoinsUI();
  doubledThisRun = false;
  const db = $('doubleBtn');
  db.disabled = false;
  db.textContent = '▶ Double Coins (Ad)';
  db.style.display = runCoins > 0 ? '' : 'none';
  $('continueScreen').classList.remove('on');

// Offer a one-per-run revive via rewarded ad OR coins after a miss.
function offerContinue() {
  Store.gameplayStop();
  if (continueUsed) { gameOver(); return; }
  state = 'paused';
  $('continueScore').textContent = score;
  $('continueBtn').textContent = Store.hasAds() ? '▶  Watch Ad & Continue' : '▶  Continue';
  $('continueBtn').disabled = false;

}
function doContinue() {
  const btn = $('continueBtn');
  btn.disabled = true;

    () => { btn.disabled = false; revive(); },
    () => { btn.disabled = false; gameOver(); }

}
function continueWithCoins() {
  if (coins < CONTINUE_COST) { showToast(`Need ${CONTINUE_COST - coins} more 🪙`); return; }
  coins -= CONTINUE_COST; saveCoins(); updateCoinsUI();
  revive();
}
function revive() {
  continueUsed = true;
  $('continueScreen').classList.remove('on');
  hudEl.classList.add('on');
  state = 'playing';
  Store.gameplayStart();
  spawnMoving();

// Watch a rewarded ad on the game-over screen to double this run's coins.
function doubleCoins() {

  const btn = $('doubleBtn');

  Store.requestRewarded(
    () => {
      doubledThisRun = true;

      $('goCoinsRun').textContent = runCoins;
      $('goCoinsTotal').textContent = coins;
      updateCoinsUI(); Store.happytime();
      btn.textContent = '✓ Coins Doubled';

// ---------------------------------------------------------------------------
// UI effects
// ---------------------------------------------------------------------------
function showCombo() {
  comboEl.textContent = combo > 1 ? `Perfect  ×${combo}` : 'Perfect!';
  comboEl.style.opacity = '1';
}
function flash() { flashEl.style.opacity = '0.45'; setTimeout(() => flashEl.style.opacity = '0', 90); }
const flashEl = $('flash');

// ---------------------------------------------------------------------------
// Loop
// ---------------------------------------------------------------------------
let lastT = performance.now();
function animate(now) {
  const dt = Math.min((now - lastT) / 16.67, 3);
  lastT = now;

  if (state === 'playing' && moving && moving.axis) {
    const d = DIFFICULTIES[settings.difficulty];
    const delta = Math.min(d.base + stack.length * d.ramp, d.cap) * dt;
    if (moving.axis === 'x') {
      moving.posX += delta * moveDir;
      if (moving.posX > MOVE_RANGE) { moving.posX = MOVE_RANGE; moveDir = -1; }
      if (moving.posX < -MOVE_RANGE) { moving.posX = -MOVE_RANGE; moveDir = 1; }
      moving.mesh.position.x = moving.posX;
    } else {
      moving.posZ += delta * moveDir;
      if (moving.posZ > MOVE_RANGE) { moving.posZ = MOVE_RANGE; moveDir = -1; }
      if (moving.posZ < -MOVE_RANGE) { moving.posZ = -MOVE_RANGE; moveDir = 1; }
      moving.mesh.position.z = moving.posZ;
    }
  }

  for (let i = debris.length - 1; i >= 0; i--) {
    const d = debris[i];
    d.vy = (d.vy || 0) - 0.012 * dt;
    d.mesh.position.y += d.vy * dt;
    d.mesh.position.x += (d.vx || 0) * dt;
    d.mesh.position.z += (d.vz || 0) * dt;
    d.mesh.rotation.z += (d.rot || 0) * dt;
    d.mesh.rotation.x += (d.rot || 0) * 0.6 * dt;
    if (d.mesh.position.y < -30) { scene.remove(d.mesh); d.mesh.geometry.dispose(); d.mesh.material.dispose(); debris.splice(i, 1); }
  }

  camCurY += (camTargetY - camCurY) * Math.min(0.08 * dt, 1);
  camera.position.set(12, 12 + camCurY, 12);
  camera.lookAt(0, camCurY + 1, 0);

  if (scorePop > 0) { scorePop = Math.max(0, scorePop - 0.08 * dt); scoreEl.style.transform = `scale(${1 + scorePop * 0.18})`; }

  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

// ---------------------------------------------------------------------------
// Resize
// ---------------------------------------------------------------------------
function onResize() {
  // Measure the actual container, not the window — more reliable inside
  // embedded preview iframes where window resize events don't always fire.
  const w = sceneEl.clientWidth || window.innerWidth;
  const h = sceneEl.clientHeight || window.innerHeight;
  if (!w || !h) return;
  renderer.setSize(w, h, true);
  const aspect = w / h;
  camera.left = -VIEW_SIZE * aspect / 2; camera.right = VIEW_SIZE * aspect / 2;
  camera.top = VIEW_SIZE / 2; camera.bottom = -VIEW_SIZE / 2;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', onResize);
if (window.visualViewport) window.visualViewport.addEventListener('resize', onResize);
// Track the container's real size so the canvas always fits the preview frame.
if (window.ResizeObserver) { new ResizeObserver(() => onResize()).observe(sceneEl); }
onResize();
setTimeout(onResize, 200);   // catch late layout in embedded players
setBackground(0);
</script>
</body>
</html>
